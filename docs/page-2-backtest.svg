<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <style>
    .bg      { fill: #FFFFFF; }
    .box     { fill: #FFFFFF; stroke: #D9D4D2; stroke-width: 1.2; rx: 6; }
    .boxhi   { fill: #FCF7F8; stroke: #7A1F2B; stroke-width: 1.6; rx: 6; }
    .boxwarn { fill: #FFFBF2; stroke: #C99A2E; stroke-width: 1.3; rx: 6; }
    .inner   { fill: #F6F3F2; stroke: #E4E4E4; stroke-width: 1; rx: 4; }
    .title   { font-size: 21px; font-weight: 700; fill: #17161A; }
    .sub     { font-size: 12.5px; fill: #7A6E71; }
    .name    { font-size: 14px; font-weight: 600; fill: #1A1719; }
    .desc    { font-size: 11.5px; fill: #7A6E71; }
    .file    { font-size: 12px; font-weight: 600; fill: #7A1F2B;
               font-family: Consolas, "Courier New", monospace; }
    .file2   { font-size: 11px; fill: #8A8385;
               font-family: Consolas, "Courier New", monospace; }
    .tiny    { font-size: 10px; fill: #8A8385; }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="900"/>

  <text class="title" x="30" y="34">PAGE 2 &#8212; Backtesting  &#183;  what you see  &#8594;  the file that draws it</text>
  <text class="sub"   x="30" y="55">Reached from ANALYSIS in the sidebar. Maroon monospace = the file to open.</text>
  <line x1="30" y1="66" x2="930" y2="66" stroke="#E4E4E4" stroke-width="1"/>

  <rect class="boxhi" x="30" y="80" width="900" height="66"/>
  <text x="46" y="98" font-size="9" font-weight="700" fill="#7A1F2B" letter-spacing="1.4">BACKTESTING</text>
  <text x="46" y="116" font-size="15" fill="#1A1719" font-family="Georgia, serif">Historical performance</text>
  <rect class="inner" x="46" y="124" width="300" height="16"/>
  <text x="56" y="136" font-size="10" fill="#1A1719">EUR EMEA</text>
  <text x="336" y="136" font-size="10" fill="#7A6E71">&#9662;</text>
  <text class="desc" x="360" y="130">Same picker as page 1 - both read st.session_state["selected_model"],</text>
  <text class="desc" x="360" y="143">so the model follows you between the two pages.</text>
  <text class="file"  x="920" y="104" text-anchor="end">ui/page_backtest.py  render()</text>
  <text class="file2" x="920" y="120" text-anchor="end">prices: core/history_loader.py</text>

  <rect class="boxwarn" x="30" y="154" width="900" height="44"/>
  <text class="name" x="46" y="173">&#9888;  No price history for X, Y &#8212; excluded, weights scaled to 100%</text>
  <text class="desc" x="46" y="189">Appears only when an asset class in the model has no column in the price file.</text>
  <text class="file"  x="920" y="173" text-anchor="end">ui/page_backtest.py</text>
  <text class="file2" x="920" y="189" text-anchor="end">maths: core/backtest.py align_weights()</text>

  <rect class="box" x="30" y="206" width="900" height="92"/>
  <text class="name" x="46" y="225">WHAT TO COMPARE</text>
  <rect class="inner" x="46" y="232" width="330" height="18"/>
  <text x="56" y="245" font-size="9.5" fill="#7A1F2B" font-weight="600">Scenarios for one profile</text>
  <text x="196" y="245" font-size="9.5" fill="#7A6E71">All risk profiles</text>
  <text x="300" y="245" font-size="9.5" fill="#7A6E71">Custom only</text>
  <rect x="46" y="256" width="9" height="9" rx="2" fill="#FFFFFF" stroke="#7A6E71"/>
  <text class="desc" x="62" y="265">Include my custom portfolio  (reveals the editor below)</text>
  <text class="name" x="46" y="285">PERIOD</text>
  <rect class="inner" x="100" y="274" width="276" height="16"/>
  <text x="110" y="286" font-size="9.5" fill="#7A6E71">1Y   3Y   5Y</text>
  <text x="196" y="286" font-size="9.5" fill="#7A1F2B" font-weight="600">10Y</text>
  <text x="232" y="286" font-size="9.5" fill="#7A6E71">20Y   All   Custom</text>
  <text class="file"  x="920" y="228" text-anchor="end">ui/sections/backtest_controls.py</text>
  <text class="file2" x="920" y="244" text-anchor="end">presets: PERIOD_PRESETS</text>
  <text class="file2" x="920" y="260" text-anchor="end">default: settings.toml [backtest].default_years</text>
  <text class="file2" x="920" y="276" text-anchor="end">these are [data-testid="stButtonGroup"]</text>
  <text class="file2" x="920" y="290" text-anchor="end">if you ever need to restyle them</text>

  <rect class="box" x="30" y="306" width="900" height="80"/>
  <text class="name" x="46" y="325">BUILD YOUR OWN PORTFOLIO</text>
  <rect class="inner" x="46" y="332" width="210" height="46"/>
  <text x="56" y="346" font-size="9.5" fill="#453C3F">Asset Class        Weight</text>
  <line x1="52" y1="350" x2="250" y2="350" stroke="#E4E4E4"/>
  <text x="56" y="362" font-size="9.5" fill="#7A6E71">EME                    4.72</text>
  <text x="56" y="374" font-size="9.5" fill="#7A6E71">DME                  10.79</text>
  <text class="desc" x="272" y="346">Editable, 16 rows. Starts from a real profile so you are</text>
  <text class="desc" x="272" y="360">tweaking rather than typing 16 numbers from scratch.</text>
  <text class="desc" x="272" y="374">The total is shown and checked, but nothing forces it to 100.</text>
  <text class="file"  x="920" y="328" text-anchor="end">ui/sections/backtest_custom.py</text>

  <rect class="box" x="30" y="394" width="900" height="92"/>
  <text class="name" x="46" y="413">GROWTH OF 100 &#8212; one line per portfolio</text>
  <polyline points="50,470 90,462 130,466 170,448 210,452 250,430 290,436 330,418 370,408"
            fill="none" stroke="#7A1F2B" stroke-width="1.8"/>
  <polyline points="50,472 90,468 130,470 170,458 210,462 250,448 290,452 330,440 370,434"
            fill="none" stroke="#8A8385" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text class="desc" x="396" y="440">Every series is rebased to 100 at the start of the chosen</text>
  <text class="desc" x="396" y="454">period, so the lines are comparable however you slice it.</text>
  <text class="desc" x="396" y="468">Two lines sitting on top of each other IS the finding -</text>
  <text class="desc" x="396" y="482">ESAA and DSAA often differ by a point or two of weight.</text>
  <text class="file"  x="920" y="416" text-anchor="end">ui/sections/backtest_results.py</text>
  <text class="file2" x="920" y="432" text-anchor="end">figure: ui/charts.py</text>
  <text class="file2" x="920" y="448" text-anchor="end">maths:  core/backtest.py run()</text>

  <rect class="box" x="30" y="494" width="900" height="84"/>
  <text class="name" x="46" y="513">DRAWDOWN &#8212; how far below the previous peak</text>
  <path d="M50,528 L90,540 L130,532 L170,562 L210,548 L250,530 L290,552 L330,534 L370,528 Z"
        fill="#F0DADE" stroke="#7A1F2B" stroke-width="1.3"/>
  <line x1="50" y1="528" x2="370" y2="528" stroke="#D9D4D2" stroke-width="1"/>
  <text class="desc" x="396" y="534">Always at or below 0. The caption underneath names the worst</text>
  <text class="desc" x="396" y="548">fall, the date it bottomed and the peak it fell from.</text>
  <text class="desc" x="396" y="562">That caption comes from drawdown_detail(), not the chart.</text>
  <text class="file"  x="920" y="516" text-anchor="end">ui/sections/backtest_results.py</text>
  <text class="file2" x="920" y="532" text-anchor="end">core/backtest.py drawdown_series()</text>
  <text class="file2" x="920" y="548" text-anchor="end">core/backtest.py drawdown_detail()</text>

  <rect class="box" x="30" y="586" width="435" height="74"/>
  <text class="name" x="46" y="605">ROLLING 12-MONTH RETURN</text>
  <polyline points="50,645 90,632 130,640 170,622 210,634 250,618 290,628 330,614 370,620"
            fill="none" stroke="#7A1F2B" stroke-width="1.5"/>
  <text class="file2" x="455" y="605" text-anchor="end">core/backtest.py</text>
  <text class="file2" x="455" y="620" text-anchor="end">rolling_return()</text>

  <rect class="box" x="495" y="586" width="435" height="74"/>
  <text class="name" x="511" y="605">ROLLING 12-MONTH VOLATILITY</text>
  <polyline points="515,640 555,634 595,646 635,628 675,642 715,624 755,636 795,626 835,632"
            fill="none" stroke="#453C3F" stroke-width="1.5"/>
  <text class="file2" x="920" y="605" text-anchor="end">core/backtest.py</text>
  <text class="file2" x="920" y="620" text-anchor="end">rolling_volatility()</text>
  <text class="tiny"  x="511" y="654">window: settings.toml [backtest].rolling_months</text>

  <rect class="boxhi" x="30" y="668" width="900" height="120"/>
  <text class="name" x="46" y="687">BACKTESTED METRICS &#8212; 13 rows, one column per portfolio</text>
  <rect x="46" y="694" width="330" height="80" fill="#FFFFFF" stroke="#E4E4E4"/>
  <rect x="46" y="694" width="330" height="14" fill="#17161A"/>
  <text x="52" y="704" font-size="8" fill="#FFFFFF">Metric            ESAA    DSAA 2026</text>
  <text x="52" y="719" font-size="8.5" fill="#453C3F">CAGR %              5.15        5.31</text>
  <rect x="46" y="722" width="330" height="12" fill="#F2F2F3"/>
  <text x="52" y="731" font-size="8.5" fill="#453C3F">Ann. volatility %  10.37       10.62</text>
  <text x="52" y="744" font-size="8.5" fill="#453C3F">Max drawdown %    -35.40      -36.10</text>
  <rect x="46" y="747" width="330" height="12" fill="#F2F2F3"/>
  <text x="52" y="756" font-size="8.5" fill="#453C3F">Monthly VaR 95 %   -4.64       -4.71</text>
  <text x="52" y="769" font-size="8.5" fill="#453C3F">Monthly CVaR 95 %  -5.93       -6.02</text>
  <text class="desc" x="396" y="712">Add a metric: put its name in METRIC_ROWS and a line in</text>
  <text class="desc" x="396" y="726">summary_metrics(). It appears here automatically.</text>
  <text class="desc" x="396" y="744">Tracking error is measured against the scenario named in</text>
  <text class="desc" x="396" y="758">settings.toml [scenarios].benchmark, so that one is always 0.</text>
  <text class="desc" x="396" y="776">Risk-free rate and VaR level: settings.toml [backtest].</text>
  <text class="file"  x="920" y="690" text-anchor="end">core/backtest.py</text>
  <text class="file2" x="920" y="706" text-anchor="end">METRIC_ROWS / summary_metrics()</text>
  <text class="file2" x="920" y="722" text-anchor="end">metrics_frame()</text>

  <line x1="30" y1="806" x2="930" y2="806" stroke="#E4E4E4"/>
  <text class="tiny" x="30" y="824">Rebalancing is monthly by default and that is a real assumption - settings.toml [backtest].rebalance. Buy-and-hold over 20 years</text>
  <text class="tiny" x="30" y="838">lets equity grow into a much larger share, which changes the drawdown numbers substantially.</text>
  <text class="tiny" x="30" y="858">Backtest CAGR sits below the CMA's expected return on purpose: the CMA is forward-looking and arithmetic, this is realised and</text>
  <text class="tiny" x="30" y="872">geometric. The gap is roughly half the variance. See HOW_TO_NAVIGATE.md section 10.</text>
</svg>
