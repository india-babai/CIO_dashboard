  <rect x="300" y="684" width="34" height="7" fill="#7A1F2B"/>
  <rect x="252" y="694" width="48" height="7" fill="#8A8385"/>
  <rect x="272" y="704" width="28" height="7" fill="#8A8385"/>
  <rect x="300" y="714" width="44" height="7" fill="#7A1F2B"/>
  <line x1="300" y1="670" x2="300" y2="725" stroke="#B4ACAA" stroke-width="1"/>
  <text class="tiny" x="368" y="700">ui/charts.py</text>
  <text class="tiny" x="368" y="713">active_weights_bar()</text>

  <text class="tiny" x="556" y="670">Type a number here and the house table ABOVE,</text>
  <text class="tiny" x="556" y="686">the charts and the frontier all update in the same</text>
  <text class="tiny" x="556" y="702">page load. That is what fold_in_pending_edits()</text>
  <text class="tiny" x="556" y="718">in ui/weight_edits.py exists to do — read the long</text>
  <text class="tiny" x="556" y="734">comment at the top of that file.</text>

