  <text x="54" y="476" font-size="9.5" fill="#1A1719">Equity · Risky FI · Defensive FI …  6 sub-groups</text>
  <line x1="46" y1="482" x2="538" y2="482" stroke="#17161A" stroke-width="2.5"/>
  <text x="54" y="496" font-size="9.5" fill="#1A1719">Equity · Fixed Income · Alternatives · Cash</text>
  <line x1="46" y1="502" x2="538" y2="502" stroke="#17161A" stroke-width="2.5"/>
  <text x="54" y="515" font-size="9" font-weight="700" fill="#1A1719" letter-spacing="0.8">RISK-RETURN METRICS</text>
  <text x="54" y="530" font-size="9.5" fill="#1A1719">Exp Ret · Exp Vol · Exp Sharpe · Tracking Error</text>

  <text class="tiny" x="556" y="428">4 stacked blocks, separated by black rules.</text>
  <text class="tiny" x="556" y="444">Hand-written HTML, not st.dataframe —</text>
  <text class="tiny" x="556" y="460">Streamlit draws tables on a canvas, which</text>
  <text class="tiny" x="556" y="476">cannot do zebra rows, merged RP headers</text>
  <text class="tiny" x="556" y="492">or the white gutter columns.</text>
  <text class="tiny" x="556" y="515">White gaps between RPs are real empty</text>
  <text class="tiny" x="556" y="531">&lt;td class="gut"&gt; cells, not padding.</text>

  <!-- ================= 7 excel ================= -->
  <rect class="box" x="30" y="550" width="900" height="40"/>
  <rect class="inner" x="46" y="561" width="200" height="19"/>
  <text x="58" y="574" font-size="10" fill="#453C3F">⬇  Download (Excel — one sheet per RP)</text>
  <text class="desc" x="262" y="574">same four blocks, one worksheet per risk profile</text>
  <text class="file" x="920" y="574" text-anchor="end">core/excel_export.py</text>

  <!-- ================= 8 what-if ================= -->
  <rect class="boxhi" x="30" y="598" width="900" height="150"/>
  <text x="46" y="617" font-size="9" font-weight="700" fill="#7A6E71" letter-spacing="1.2">WHAT-IF — ADJUST INDIVIDUAL WEIGHTS</text>
  <text class="file"  x="920" y="617" text-anchor="end">ui/sections/whatif_editor.py</text>
