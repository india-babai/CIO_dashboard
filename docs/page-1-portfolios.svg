  <text x="46" y="912" font-size="14" fill="#1A1719" font-family="Georgia, serif">This model vs the efficient frontier</text>
  <text class="file"  x="920" y="895" text-anchor="end">ui/sections/frontier_section.py</text>
  <text class="file2" x="920" y="910" text-anchor="end">maths: core/frontier.py  (needs SciPy)</text>

  <path d="M 60 985 Q 150 930 330 918" fill="none" stroke="#7A1F2B" stroke-width="2.4"/>
  <path d="M 78 988 L 120 972 L 165 960 L 215 950 L 262 944" fill="none" stroke="#2E7D9E" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="78" cy="988" r="3" fill="#2E7D9E"/><circle cx="120" cy="972" r="3" fill="#2E7D9E"/>
  <circle cx="165" cy="960" r="3" fill="#2E7D9E"/><circle cx="215" cy="950" r="3" fill="#2E7D9E"/>
  <circle cx="262" cy="944" r="3" fill="#2E7D9E"/>
  <path d="M 84 984 L 128 966 L 174 953 L 224 942 L 272 935" fill="none" stroke="#B8862B" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="96" cy="996" r="2.4" fill="#17161A"/><circle cx="140" cy="1000" r="2.4" fill="#17161A"/>
  <circle cx="205" cy="978" r="2.4" fill="#17161A"/><circle cx="290" cy="962" r="2.4" fill="#17161A"/>
  <text class="tiny" x="352" y="930">— maroon curve = the efficient frontier</text>
  <text class="tiny" x="352" y="946">— one dotted line per scenario (RP1→RP5)</text>
  <text class="tiny" x="352" y="962">— black dots = individual asset classes</text>
  <text class="tiny" x="352" y="978">— click a legend entry to hide that series</text>
  <text class="tiny" x="352" y="994">— table below gives the “return gap (pp)”</text>
  <text class="tiny" x="620" y="946">Solving is cached (@st.cache_data) because it</text>
  <text class="tiny" x="620" y="962">is ~120 optimisations. The cache key includes</text>
  <text class="tiny" x="620" y="978">the CMA, so a user who edited the CMA gets</text>
  <text class="tiny" x="620" y="994">their own frontier, never someone else’s.</text>

  <!-- ================= footer ================= -->
  <rect class="box" x="30" y="1016" width="900" height="34"/>
  <text class="desc" x="46" y="1037">CIO Model Portfolio Dashboard · illustrative figures · CMA edits are per-session only</text>
  <text class="file" x="920" y="1037" text-anchor="end">app.py  _render_footer()</text>

  <text class="tiny" x="30" y="1078">Boxes outlined in maroon are the three places a user actually interacts with the data: the model dropdown, the house table, and the What-if editor.</text>
  <text class="tiny" x="30" y="1096">Everything on this page reads the SAME session weights, which is why an edit in the What-if card changes the table, the charts and the frontier together.</text>
</svg>
