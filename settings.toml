# =============================================================================
# CIO Model Portfolio Dashboard - configuration
# Everything the dashboard needs that is NOT portfolio / CMA data itself.
# Add asset classes, rename groups, relabel scenarios here - no code changes.
# =============================================================================

# CMA currencies that have files in [data].cma_dir (cma_<CCY>.csv + corr_<CCY>.csv).
# There is no currency picker in the UI - each model row carries its own currency
# and the matching CMA is used automatically. Keep this before any [table].
currencies = ["USD", "SGD", "EUR", "GBP"]

[app]
# Browser tab title and the small grey line next to the logo.
title    = "CIO Model Portfolios"
subtitle = "Strategic & Tactical Asset Allocation"
# NOTE: colours are NOT set here. Every colour in the app (CSS *and* charts)
# comes from  ui/css/01_variables.css  — that is the single source of truth.
# The only colours in this file are the per-group ones in [[subgroups]] and
# [[groups]] further down, because those belong with the taxonomy.

[data]
model_portfolios = "data/model_portfolios.xlsx"
cma_dir          = "data/cma"                      # cma_<CCY>.csv + corr_<CCY>.csv
history_dir      = "data/history"                  # prices_<CCY>.csv (daily levels)
# CMA edits are per-session only (kept in st.session_state) and never written to disk.

# ----------------------------------------------------------------------------
# Scenario (weight) columns shown in the landing table.
#   columns   : the weight sets held per (model, risk profile, asset class);
#               these are the editable columns in the granular block.
#   change    : the "Change" column = change[0] - change[1]
#   benchmark : Tracking Error in the metrics block is measured against this
# ----------------------------------------------------------------------------
[scenarios]
columns   = ["ESAA", "DSAA 2026", "DSAA 2025"]
change    = ["DSAA 2026", "DSAA 2025"]
benchmark = "ESAA"

# ----------------------------------------------------------------------------
# Risk / return metrics block
#   risk_free : blank -> use the lowest-volatility asset's expected return
# ----------------------------------------------------------------------------
[metrics]
risk_free = ""

# ----------------------------------------------------------------------------
# Backtesting page
#   rebalance      "M" monthly, "Q" quarterly, "Y" yearly, "" = buy and hold
#   risk_free      annual %, used for Sharpe and Sortino
#   var_confidence 0.95 -> the table reports monthly VaR / CVaR at 95%
#   rolling_months window for the rolling return / volatility charts
#   default_years  how much history the page shows when you first open it
# ----------------------------------------------------------------------------
[backtest]
rebalance      = "M"
risk_free      = 3.3
var_confidence = 0.95
rolling_months = 12
default_years  = 10

# ----------------------------------------------------------------------------
# Efficient frontier (Optimisation section)
# ----------------------------------------------------------------------------
[frontier]
points    = 120
risk_free = ""

# ----------------------------------------------------------------------------
# Validation tolerances
# ----------------------------------------------------------------------------
[validation]
weight_sum_tolerance   = 0.5
allow_negative_weights = false

# ----------------------------------------------------------------------------
# Risk profiles - id must match the values in the model_portfolios file
# ----------------------------------------------------------------------------
[[risk_profiles]]
id = 1
label = "RP1 - Conservative"
short = "RP1"

[[risk_profiles]]
id = 2
label = "RP2 - Moderately Conservative"
short = "RP2"

[[risk_profiles]]
id = 3
label = "RP3 - Balanced"
short = "RP3"

[[risk_profiles]]
id = 4
label = "RP4 - Growth"
short = "RP4"

[[risk_profiles]]
id = 5
label = "RP5 - Aggressive"
short = "RP5"

